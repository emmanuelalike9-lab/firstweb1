<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Successful | Oluwafirst Sanitary Homes</title>
  <style>
    :root {
      --primary: #1d4ed8;
      --success: #0f766e;
      --ink: #10233d;
      --muted: #5d6b82;
      --bg: #f5f7fb;
      --card: #ffffff;
      --border: #dfe7f5;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #eef4ff 0%, #f5f7fb 50%, #eefaf6 100%);
      color: var(--ink);
      padding: 24px;
    }

    .success-card {
      width: min(100%, 560px);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 20px 50px rgba(16, 35, 61, 0.12);
      padding: 40px 32px;
      text-align: center;
    }

    .badge {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: rgba(15, 118, 110, 0.12);
      color: var(--success);
      font-size: 2.5rem;
      font-weight: 700;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 4vw, 2.6rem);
    }

    p {
      margin: 0 auto 24px;
      max-width: 34ch;
      color: var(--muted);
      line-height: 1.6;
    }

    .summary {
      background: #f8fbff;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 18px;
      margin-bottom: 24px;
      font-size: 0.95rem;
      color: var(--ink);
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-block;
      text-decoration: none;
      padding: 12px 18px;
      border-radius: 10px;
      font-weight: 700;
      transition: transform 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .primary {
      background: linear-gradient(135deg, var(--primary) 0%, #163ea8 100%);
      color: #fff;
    }

    .secondary {
      background: #edf2ff;
      color: var(--ink);
    }
  </style>
</head>
<body>
  <div class="success-card">
    <div class="badge">✓</div>
    <h1>Payment Successful</h1>
    <p>Your order has been placed successfully. We will contact you shortly regarding delivery.</p>

    <div class="summary" id="payment-summary">
      Status: Payment completed
    </div>

    <div class="actions">
      <a href="index.html" class="btn primary">Back to Home</a>
      <a href="product.html" class="btn secondary">Continue Shopping</a>
    </div>
  </div>

  <script>
    const paymentRecord = JSON.parse(localStorage.getItem('paymentRecord') || '{}');
    const summary = document.getElementById('payment-summary');

    if (paymentRecord && paymentRecord.method) {
      summary.textContent = `Status: Payment completed via ${paymentRecord.method} — Amount: ₦${Number(paymentRecord.amount || 0).toLocaleString()}`;
    }
  </script>
</body>
</html>
