<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
    <link rel="stylesheet" href="assets/css/cart.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Shopping Cart</h1>
            <a href="index.html" class="back-link">← Back to Shop</a>
        </header>

        <main class="cart-section">
            <div class="cart-items">
                <table class="items-table">
                    <thead>
                        <tr>
                            <th>Product</th>
                            <th>Price</th>
                            <th>Quantity</th>
                            <th>Total</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="cartItems">
                        <!-- Cart items will be populated here by JavaScript -->
                    </tbody>
                </table>

                <div class="empty-cart-message" id="emptyMessage" style="display: none;">
                    <p>Your cart is empty</p>
                    <a href="index.html" class="continue-shopping">Continue Shopping</a>
                </div>
            </div>

            <aside class="cart-summary">
                <div class="summary-box">
                    <h2>Order Summary</h2>
                    
                    <div class="summary-item">
                        <span>Subtotal:</span>
                        <span id="subtotal">₦0</span>
                    </div>

                    <!-- <div class="summary-item">
                        <span>Shipping:</span>
                        <span id="shipping">₦10</span>
                    </div> -->

                    <div class="summary-item">
                        <span>Delivery fee:</span>
                        <span id="Delivery_fee">₦0</span>
                    </div>

                    <hr class="divider">

                    <div class="summary-item total">
                        <span>Total:</span>
                        <span id="total">₦10</span>
                    </div>

                    <a href="checkout.html" class="checkout-btn">Proceed to Checkout</a>
                    <a href="index.html" class="continue-shopping-btn">Continue Shopping</a>
                </div>
            </aside>
        </main>
    </div>

    <script src="assets/js/shopping.js"></script>
    <script src="assets/js/cart.js"></script>
</body>
</html>
