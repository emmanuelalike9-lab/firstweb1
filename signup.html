<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>signup</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/signup.css">
    <script type="text/javascript" src="assets/js/validation.js" defer></script>
</head>
<body>
    <!-- <script>
        localStorage.setItem('authToken', token);
        window.location.href = 'checkout.html'
    </script> -->
    <div class="wrapper">
        <h1>Signup</h1>
        <p id="error-message"></p>
        <form id="form" action="payment.html" method="get">
            <div >
                <label for="firstname-input">
                    <i class="fas fa-user"></i>
                </label>
                <input  type="text" name="firstname" id="firstname-input" placeholder="Firstname" required>
            </div>
            <div>
                <label for="email-input">
                    <i class="fas fa-envelope"></i>
                </label>
                <input type="email" name="email" id="email-input" placeholder="Email" required>
            </div>
            <div>
                <label for="password-input">
                    <i class="fas fa-lock"></i>
                </label>
                <input type="password" name="password" id="password-input" placeholder="Password" required>
            </div>
            <div>
                <label for="confirm-password-input">
                    <i class="fas fa-lock"></i>
                </label>
                <input type="password" name="confirm-password" id="confirm-password-input" placeholder="Confirm Password" required>
            </div>
            <button>Signup</button>
        </form>
        <p>Already have an account? <a href="login.html">Login</a></p>
    </div>
    
</body>
</html>
